name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity,
# which would silently stop the daily "Build with v2ray_api" job from tracking
# upstream. This makes a tiny monthly commit to reset that clock.

on:
  schedule:
    - cron: '23 5 1 * *'   # 1st of each month, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive marker
        run: |
          date -u +%FT%TZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive" || { echo "nothing to commit"; exit 0; }
          git push
